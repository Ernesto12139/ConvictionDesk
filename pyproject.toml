[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "convictiondesk"
version = "0.11.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "httpx>=0.27,<1", "uvicorn>=0.30,<1", "tzdata>=2025"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
hybrid = ["numpy>=2,<3", "onnxruntime>=1.22,<2", "tokenizers>=0.22,<1"]
jev-mem-poc = ["numpy>=2,<3", "networkx>=3,<4", "tqdm>=4,<5", "typesafe-sdk>=0.7,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
market_agent = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg", "demo_assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=data/pytest_tmp"
