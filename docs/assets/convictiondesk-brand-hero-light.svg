<title id="title">ConvictionDesk — From holdings to conviction</title>
<desc id="desc">Original brand illustration. Holdings in research order and their evidence pass an evidence cutoff into one case file: a cited judgment or UNDETERMINED, counterevidence, what would change it and the next check, saved as Fast and Deep revisions, then a hypothetical What-if on cash, shares and concentration. A schematic, not a screenshot.</desc>
