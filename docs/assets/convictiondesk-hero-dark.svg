<text x="64" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="650" fill="#F1F4F1" text-anchor="start"><tspan x="64" dy="0">From market noise</tspan><tspan x="64" dy="50">to portfolio decisions.</tspan></text>
