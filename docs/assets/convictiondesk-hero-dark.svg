<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">ConvictionDesk — From market noise to portfolio decisions</title>
<desc id="desc">Scattered market signals pass a point-in-time cutoff and become one typed, cited decision about a position.</desc>
