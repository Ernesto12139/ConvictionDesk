name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable annotated release tag to verify
        required: true
        type: string
      expected_commit:
        description: Full reviewed release commit SHA
        required: true
        type: string
      expected_tag_object:
        description: Full annotated tag object SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.event.pull_request.head.sha || github.sha }}
      # checkout can replace an annotated tag with the event's peeled commit.
      # Restore only the runner's local ref from the authoritative remote object.
      - name: Restore annotated release tag and bind reviewed source
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit || github.event.pull_request.head.sha || github.sha }}
          EXPECTED_TAG_OBJECT: ${{ inputs.expected_tag_object }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          tag_object="$(git rev-parse FETCH_HEAD)"
          test "$(git cat-file -t "$tag_object")" = tag
          test "$(git rev-parse "$tag_object^{commit}")" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          if [ -n "$EXPECTED_TAG_OBJECT" ]; then test "$tag_object" = "$EXPECTED_TAG_OBJECT"; fi
          git update-ref "refs/tags/$RELEASE_TAG" "$tag_object"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[test]"
      - name: Run public tests with an exclusively owned external root
        shell: bash
        run: |
          export MIA_ISOLATED_ROOT="$RUNNER_TEMP/public-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$MIA_ISOLATED_ROOT"
          python -m pytest -o addopts='' --basetemp="$MIA_ISOLATED_ROOT/pytest" -q
      - name: Verify public import and resource closure
        run: python release/check_import_closure.py --source .
      - name: Audit public history and identity
        if: github.event_name != 'pull_request'
        run: python release/audit_public_git.py --repo . --email 198560242+Ernesto12139@users.noreply.github.com --expected-root 555ca4fbc531e61bf0fdc33d5022fec38dece11b
      # A pull_request checkout holds GitHub's synthetic merge commit and extra
      # refs. Audit the PR head instead, as the main it would fast-forward to.
      - name: Audit pull request head as future main
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git update-ref refs/audit/pr-head "$HEAD_SHA"
          git init -q "$RUNNER_TEMP/pr-audit"
          git -C "$RUNNER_TEMP/pr-audit" fetch -q --tags "$GITHUB_WORKSPACE" refs/audit/pr-head:refs/heads/main
          git -C "$RUNNER_TEMP/pr-audit" checkout -q main
          python release/audit_public_git.py --repo "$RUNNER_TEMP/pr-audit" --email 198560242+Ernesto12139@users.noreply.github.com --expected-root 555ca4fbc531e61bf0fdc33d5022fec38dece11b
      - name: Bind tagged build to its release commit
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python release/audit_public_git.py --repo . --email 198560242+Ernesto12139@users.noreply.github.com --release-tag "$RELEASE_TAG"
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.64.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real synthetic HTTP and browser journeys
        env:
          MIA_BROWSER_CHANNEL: chromium
          EXPECTED_COMMIT: ${{ inputs.expected_commit || github.event.pull_request.head.sha || github.sha }}
        run: |
          revision="$(git rev-parse HEAD)"
          test "$revision" = "$EXPECTED_COMMIT"
          MIA_DEMO_DIR="$RUNNER_TEMP/demo" MIA_BUILD_REVISION="$revision" python -m market_agent.serve &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/health && break; sleep 1; done
          python scripts/smoke_public_demo.py --base http://127.0.0.1:8080 --expected-revision "$revision"
          node scripts/smoke_public_demo_browser.cjs http://127.0.0.1:8080 output/browser "$RUNNER_TEMP/browser/node_modules/playwright/package.json"
      - name: Real public-IVS result-card What-if at desktop and mobile widths
        env:
          MIA_BROWSER_CHANNEL: chromium
        run: |
          MIA_RUNTIME_MODE=PUBLIC_DEMO MIA_DEMO_DIR="$RUNNER_TEMP/ivs-legacy" python -m market_agent.public_ivs --root "$RUNNER_TEMP/public-ivs" --serve --port 8791 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8791/api/public-ivs && break; sleep 1; done
          node scripts/smoke_public_ivs_browser.cjs http://127.0.0.1:8791 output/ivs-browser "$RUNNER_TEMP/browser/node_modules/playwright/package.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-evidence
          path: |
            output/browser
            output/ivs-browser
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.pull_request.head.sha || github.sha }}
      - name: Build and smoke read-only preview
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit || github.event.pull_request.head.sha || github.sha }}
        run: |
          revision="$(git rev-parse HEAD)"
          test "$revision" = "$EXPECTED_COMMIT"
          docker build --build-arg MIA_BUILD_REVISION="$revision" -t convictiondesk .
          docker run -d --name preview -p 127.0.0.1:8080:8080 --cap-drop ALL --security-opt no-new-privileges convictiondesk
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/health && break; sleep 1; done
          python3 scripts/smoke_public_demo.py --base http://127.0.0.1:8080 --expected-revision "$revision"
          test "$(docker inspect --format '{{.Config.User}}' preview)" = '10001:10001'
      - name: Installed public IVS journey without network or writable root filesystem
        run: |
          mkdir -p output
          docker run --rm --network none --read-only --tmpfs /tmp:rw,mode=1777 --tmpfs /var/lib/mia-demo:rw,uid=10001,gid=10001 --entrypoint python convictiondesk -m market_agent.public_ivs --root /tmp/public-ivs --journey > output/ivs-offline.json
          python3 -c "import json; d=json.load(open('output/ivs-offline.json')); assert d['research']['fast']['status']==d['research']['deep']['status']=='COMPLETE'; assert d['research']['same_task'] and d['research']['revision_one_preserved']; assert d['what_if']['after']['nav']=='12979'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-ivs-offline-journey
          path: output/ivs-offline.json
