name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - name: Audit public history and identity
        if: github.event_name != 'pull_request'
        run: python release/audit_public_git.py --repo . --email 198560242+Ernesto12139@users.noreply.github.com --expected-root 555ca4fbc531e61bf0fdc33d5022fec38dece11b
      # A pull_request checkout holds GitHub's synthetic merge commit and extra
      # refs. Audit the PR head instead, as the main it would fast-forward to.
      - name: Audit pull request head as future main
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git update-ref refs/audit/pr-head "$HEAD_SHA"
          git init -q "$RUNNER_TEMP/pr-audit"
          git -C "$RUNNER_TEMP/pr-audit" fetch -q --tags "$GITHUB_WORKSPACE" refs/audit/pr-head:refs/heads/main
          git -C "$RUNNER_TEMP/pr-audit" checkout -q main
          python release/audit_public_git.py --repo "$RUNNER_TEMP/pr-audit" --email 198560242+Ernesto12139@users.noreply.github.com --expected-root 555ca4fbc531e61bf0fdc33d5022fec38dece11b
      - name: Bind tagged build to its release commit
        if: startsWith(github.ref, 'refs/tags/')
        run: python release/audit_public_git.py --repo . --email 198560242+Ernesto12139@users.noreply.github.com --release-tag "${{ github.ref_name }}"
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.64.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real synthetic HTTP and browser journeys
        env:
          MIA_BROWSER_CHANNEL: chromium
        run: |
          MIA_DEMO_DIR="$RUNNER_TEMP/demo" MIA_BUILD_REVISION="$GITHUB_SHA" python -m market_agent.serve &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/health && break; sleep 1; done
          python scripts/smoke_public_demo.py --base http://127.0.0.1:8080 --expected-revision "$GITHUB_SHA"
          node scripts/smoke_public_demo_browser.cjs http://127.0.0.1:8080 output/browser "$RUNNER_TEMP/browser/node_modules/playwright/package.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-evidence
          path: output/browser
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke read-only preview
        run: |
          docker build --build-arg MIA_BUILD_REVISION="$GITHUB_SHA" -t convictiondesk .
          docker run -d --name preview -p 127.0.0.1:8080:8080 --cap-drop ALL --security-opt no-new-privileges convictiondesk
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/health && break; sleep 1; done
          python3 scripts/smoke_public_demo.py --base http://127.0.0.1:8080 --expected-revision "$GITHUB_SHA"
          test "$(docker inspect --format '{{.Config.User}}' preview)" = '10001:10001'
